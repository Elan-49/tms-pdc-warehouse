<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMWA PDC Warehouse — TEST DUMMY</title>
  <link rel="icon" type="image/png" href="assets/ut-logo-bulat.png"><link rel="stylesheet" href="styles.css"></head><body class="auth-booting"><div class="session-loader" id="sessionLoader" aria-live="polite" aria-label="Memuat sesi">
  <div class="session-loader-card">
    <div class="session-loader-orbit" aria-hidden="true">
      <div class="session-loader-orbit-dots" aria-hidden="true">
        <svg class="session-loader-orbit-svg" viewBox="0 0 132 132" focusable="false">
          <g class="session-loader-orbit-ring">
            <circle cx="66" cy="23" r="4"></circle>
            <circle cx="109" cy="66" r="4"></circle>
            <circle cx="66" cy="109" r="4"></circle>
            <circle cx="23" cy="66" r="4"></circle>
          </g>
        </svg>
      </div>
      <img src="assets/ut-logo-bulat.png" alt="United Tractors" class="session-loader-logo">
    </div>
  </div>
</div>

<div class="login-screen" id="loginScreen">
    <div class="login-panel">
    <div class="login-card">
      <img class="login-badge" src="assets/ut-logo-2.png" alt="United Tractors">
      <h1 id="authTitle">Selamat Datang</h1>
      <p class="auth-subtitle" id="authSubtitle">Silahkan masuk</p>
      <form id="loginForm">
        <label>Email / Nama Pengguna<input id="loginUser" type="text" autocomplete="username" placeholder="cth. nama Anda" required></label>
        <label>Password / Passcode<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
        <button class="btn primary full" type="submit">Masuk</button>
        <p class="login-forgot-link"><button type="button" id="showForgotBtn" class="link-btn">Lupa password?</button></p>
      </form>
      <form id="signupForm" class="hidden">
        <label>Nama Lengkap<input id="signupName" type="text" autocomplete="name" placeholder="cth. Budi Santoso" required></label>
        <label>Email<input id="signupEmail" type="email" autocomplete="email" placeholder="nama@contoh.com" required></label>
        <label>Password<input id="signupPass" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required></label>
        <label>Konfirmasi Password<input id="signupPassConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="Ulangi password" required></label>
        <button class="btn primary full" type="submit">Buat Akun</button>
      </form>
      <form id="forgotForm" class="hidden">
        <label>Email akun Anda<input id="forgotEmail" type="email" autocomplete="email" placeholder="nama@contoh.com" required></label>
        <button class="btn primary full" type="submit">Kirim Link Reset</button>
        <p class="login-forgot-link"><button type="button" id="backToLoginBtn" class="link-btn">Kembali ke halaman masuk</button></p>
      </form>
      <form id="resetForm" class="hidden">
        <label>Password Baru<input id="resetPass" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required></label>
        <label>Konfirmasi Password Baru<input id="resetPassConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="Ulangi password baru" required></label>
        <button class="btn primary full" type="submit">Simpan Password Baru</button>
      </form>
      <div class="login-switch" role="group" aria-label="Pilihan autentikasi">
        <button type="button" class="login-link active" id="showLoginBtn">Masuk</button>
        <button type="button" class="login-link" id="showSignupBtn">Buat Akun</button>
      </div>
      <p class="login-error hidden" id="loginError"></p>
    </div>
  </div>
</div>
<div class="app-shell hidden" id="appShell"><div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div><aside class="sidebar" id="sidebar">
<div class="menu-panel-head"><div><div class="menu-eyebrow">COMMAND CENTER</div><h2 id="sidebarTitle">Dashboard</h2></div><button id="sidebarClose" class="menu-close" type="button" aria-label="Tutup menu">×</button></div>

<main class="main"><header class="topbar ut-topbar"><a class="ut-header-brand" href="#" data-go="dashboard" aria-label="Kembali ke Dashboard"><img src="assets/ut-logo-2.png" alt="United Tractors"></a><div class="ut-header-actions"><button id="profileToggle" class="ut-profile" type="button" aria-label="Buka profil pengguna" aria-expanded="false" aria-controls="profileMenu"><span class="ut-profile-avatar" aria-hidden="true"><span class="ut-profile-status-dot" id="profileStatusDot"></span><span class="ut-profile-alert hidden" id="profileStatusAlert" aria-hidden="true">!</span></span><span class="ut-profile-copy"><strong id="profileName">Pengguna</strong><small id="profileRole">User</small></span></button><div class="ut-profile-menu hidden" id="profileMenu" role="menu"><div class="ut-profile-menu-label">PROFILE</div><div class="ut-profile-menu-name" id="profileMenuName">Pengguna</div><div class="ut-profile-menu-email" id="profileMenuEmail">—</div><div class="ut-profile-menu-role" id="profileMenuRole">User</div><div class="ut-profile-sync" id="profileSyncStatus" data-state="syncing" role="status" aria-live="polite"><span class="ut-profile-sync-dot" aria-hidden="true"></span><div class="ut-profile-sync-copy"><strong id="profileSyncTitle">Status Data</strong><span id="profileSyncText">Sedang sinkronisasi</span></div></div><div class="ut-profile-menu-actions"><button type="button" class="ut-profile-action" id="profileChangePw" role="menuitem"><span class="icon-key" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="8.5" cy="15.5" r="4.5"></circle><path d="M11.8 12.2 20 4m-3 0 3 3m-6 0 3 3"></path></svg></span> Ganti Password</button><button type="button" class="ut-profile-action danger" id="profileLogout" role="menuitem"><span aria-hidden="true">⏻</span> Keluar</button></div></div><button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Buka menu navigasi" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button></div></header><div id="app"></div><footer class="ut-bottom-footer" aria-label="Identitas aplikasi"><div class="ut-footer-motto"><img src="assets/ut-motto.png" alt="United Tractors Member of Astra"></div><div class="ut-footer-line" aria-hidden="true"></div></footer></main></div>

<script src="auth.js"></script>
