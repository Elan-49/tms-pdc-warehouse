<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMS PDC Warehouse</title>
  <link rel="icon" type="image/png" href="./ut-logo-bulat.png"><link rel="stylesheet" href="styles.css"></head><body class="auth-booting"><div class="session-loader" id="sessionLoader" aria-live="polite" aria-label="Memuat sesi">
  <div class="session-loader-card">
    <div class="session-loader-orbit" aria-hidden="true">
      <div class="session-loader-orbit-dots" aria-hidden="true">
        <svg class="session-loader-orbit-svg" viewBox="0 0 132 132" focusable="false">
          <g class="session-loader-orbit-ring">
            <circle cx="66" cy="23" r="4"></circle>
            <circle cx="109" cy="66" r="4"></circle>
            <circle cx="66" cy="109" r="4"></circle>
            <circle cx="23" cy="66" r="4"></circle>
          </g>
        </svg>
      </div>
      <img src="ut-logo-bulat.png" alt="United Tractors" class="session-loader-logo">
    </div>
  </div>
</div>

<div class="login-screen" id="loginScreen">
    <div class="login-panel">
    <div class="login-card">
      <img class="login-badge" src="ut-logo-2.png" alt="United Tractors">
      <h1 id="authTitle">Selamat Datang</h1>
      <p class="auth-subtitle" id="authSubtitle">Silahkan masuk</p>
      <form id="loginForm">
        <label>Email / Nama Pengguna<input id="loginUser" type="text" autocomplete="username" placeholder="cth. nama Anda" required></label>
        <label>Password / Passcode<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form>
      <form id="signupForm" class="hidden">
        <label>Nama Lengkap<input id="signupName" type="text" autocomplete="name" placeholder="cth. Budi Santoso" required></label>
        <label>Email<input id="signupEmail" type="email" autocomplete="email" placeholder="nama@contoh.com" required></label>
        <label>Password<input id="signupPass" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required></label>
        <label>Konfirmasi Password<input id="signupPassConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="Ulangi password" required></label>
        <button class="btn primary full" type="submit">Buat Akun</button>
      </form>
      <div class="login-switch" role="group" aria-label="Pilihan autentikasi">
        <button type="button" class="login-link active" id="showLoginBtn">Masuk</button>
        <button type="button" class="login-link" id="showSignupBtn">Buat Akun</button>
      </div>
      <p class="login-error hidden" id="loginError"></p>
    </div>
  </div>
</div>
<div class="app-shell hidden" id="appShell"><div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div><aside class="sidebar" id="sidebar">
<div class="menu-panel-head"><div><div class="menu-eyebrow">COMMAND CENTER</div><h2>Dashboard</h2></div><button id="sidebarClose" class="menu-close" type="button" aria-label="Tutup menu">×</button></div>
