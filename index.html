<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMS PDC Warehouse V3.0.5</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="login-screen" id="loginScreen">
  <div class="login-bg"><img src="login-hero.jpg" alt="Gedung United Tractors"></div>
  <div class="login-bg-gradient" aria-hidden="true"></div>
  <div class="login-panel">
    <div class="login-card">
      <img class="login-badge" src="ut-logo-bulat.png" alt="United Tractors">
      <h1>TMS PDC WAREHOUSE</h1>
      <form id="loginForm">
        <label>Email / Nama Pengguna<input id="loginUser" type="text" autocomplete="username" placeholder="cth. nama Anda" required></label>
        <label>Password / Passcode<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
        <button class="btn primary full" type="submit">Masuk</button>
      </form>
      <p class="login-error hidden" id="loginError"></p>
      <p class="login-mode" id="loginMode"></p>
    </div>
  </div>
</div>
<div class="app-shell hidden" id="appShell"><div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div><aside class="sidebar" id="sidebar"><a class="brand brand-logo" href="#" data-go="dashboard" aria-label="Kembali ke Dashboard"><img src="ut-logo.png" alt="United Tractors"></a><nav id="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="observe">Observation</button><button data-view="data">Data Waktu</button><button data-view="master">Master Process & Lean</button><div class="nav-label">ANALYSIS</div><button data-view="quality">Data Quality</button><button data-view="uniformity">Uji Keseragaman</button><button data-view="sufficiency">Uji Kecukupan</button><button data-view="rating">Rating Factor</button><button data-view="standard">Standard Time</button><div class="nav-label">LEAN</div><button data-view="waste">Waste & Pareto</button><div class="nav-label">TOOLS</div><button id="exportCsv">⇩ Export CSV</button><label class="import-btn">⇧ Import CSV<input id="importCsv" type="file" accept=".csv" hidden></label></nav></aside>
<main class="main"><header class="topbar ut-topbar"><button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Buka menu navigasi" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button><div class="page-heading"><p class="eyebrow" id="pageEyebrow">TIME & MOTION STUDY</p><h1 id="pageTitle">Dashboard</h1></div><div class="ut-header-logo-2" aria-label="United Tractors"><img src="ut-logo-2.png" alt="United Tractors"></div></header><div id="app"></div><footer class="ut-bottom-footer" aria-label="Kontrol dan identitas aplikasi"><div class="ut-footer-reset"><button id="logoutBtn" class="btn ghost" type="button">⏻ Keluar</button></div><div class="ut-footer-motto"><img src="ut-motto.png" alt="United Tractors Member of Astra"></div><div class="ut-footer-line" aria-hidden="true"></div></footer></main></div>
<script src="auth-config.js"></script>
<script src="auth.js"></script>
<script src="cloud-sync.js"></script>
<script src="master-data.js"></script><script src="app.js"></script></body></html>
